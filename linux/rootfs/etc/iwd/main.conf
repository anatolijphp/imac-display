# iwd settings for the iMac (iMac17,1: Broadcom BCM43602, brcmfmac driver).
[DriverQuirks]
# Wi-Fi power saving off. With it on, brcmfmac sometimes misses unicast frames: on 2026-11-26 a boot
# was associated and got its DHCP lease, but DNS to the router timed out and no SSH or MacBook
# connection reached the iMac. Power saving makes no sense on an appliance on mains power anyway.
PowerSaveDisable=brcmfmac
