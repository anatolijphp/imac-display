# iwd settings for the iMac (iMac17,1: Broadcom BCM43602, brcmfmac driver).
[DriverQuirks]
# Wi-Fi power saving off. With it on, brcmfmac sometimes misses unicast frames: on 2026-11-26 a boot
# was associated and got its DHCP lease, but DNS to the router timed out and no SSH or MacBook
# connection reached the iMac. Power saving makes no sense on an appliance on mains power anyway.
PowerSaveDisable=brcmfmac

[General]
# Protected management frames (802.11w) off.
# The fault this is for: a start that comes from macOS (3 of 5 on 2026-11-26) joins the network, gets
# its address, and seconds later nothing addressed to the iMac gets through any more, while iwd stays
# "connected". It never happened in 24 Linux-to-Linux reconnects of every kind (driver reloads,
# restarts without a goodbye). The router runs WPA2/WPA3 mixed mode and macOS joins it with
# protection on; the working theory is that the router still holds macOS's protected session for
# this card, drops the new keys when its check of the old session times out, and that this card's
# 2015 firmware, having negotiated protection, ignores the router's unprotected "you are
# disconnected". With protection off the card obeys that message and iwd simply connects again.
# NOT YET CONFIRMED: needs several clean starts from macOS. If the fault comes back with this
# setting, the theory is wrong; the watchdog (imac-wifi-watchdog) covers it either way.
ManagementFrameProtection=0
