# The boot splash is ended by the receiver, at the moment its own picture is on the screen.
# Stock behaviour was to end it here as soon as logins are allowed, which is the same moment the
# receiver starts: the screen then stayed black for about two seconds until the waiting screen came.
# So: wait here until the splash is gone (at most 12 s, in case the receiver cannot take the screen),
# then quit without clearing the screen. Not when the receiver stays off (console only, safe graphics).
[Unit]
After=imacdisplayd.service

[Service]
ExecStartPre=-/usr/local/lib/imac-display/wait-for-receiver
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
