# Boot splash: the waiting screen's look (theme rendered by imacdisplayd --render-splash).
[Daemon]
Theme=imac-display
ShowDelay=0
# Show the splash on the firmware's own framebuffer from the first second. Without this Plymouth
# waits for the graphics driver (amdgpu), which on this iMac is ready only about 7 s into the start:
# until then the screen kept whatever the boot loader left on it.
UseSimpledrm=1
# One picture pixel per screen pixel on every screen: splash.png is drawn for 3840x2160.
DeviceScale=1
