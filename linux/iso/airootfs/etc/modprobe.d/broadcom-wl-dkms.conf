# Overrides /usr/lib/modprobe.d/broadcom-wl-dkms.conf from the broadcom-wl-dkms package.
# That file blacklists brcmfmac, which is the driver the iMac17,1's BCM43602 card needs.
# Here nothing in-kernel is blacklisted, and the proprietary "wl" module is kept from
# auto-loading. /usr/local/bin/imac-wifi-select loads wl only for cards that need it.
blacklist wl
